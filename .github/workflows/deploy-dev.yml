name: Deploy to dev.weekook.com

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /var/www/weekook-dev
            git fetch origin develop
            git reset --hard origin/develop
            npm install --workspaces --if-present
            npx prisma generate
            npx prisma db push --accept-data-loss
            npm run build
            pm2 reload weekook-dev
            # BUG-011: ensure Nginx server_tokens is off (suppress version in headers)
            grep -q "server_tokens off" /etc/nginx/nginx.conf 2>/dev/null || (sudo sed -i 's/^\(http\s*{\)/\1\n    server_tokens off;/' /etc/nginx/nginx.conf && sudo nginx -t && sudo systemctl reload nginx) || true
